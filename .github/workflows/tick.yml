name: Tick private price policy

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch to private policy repo
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -e
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/monken32fr/casix-wb-price-policy/dispatches \
            -d '{"event_type":"price_policy_tick"}'
          echo "dispatched price_policy_tick"
